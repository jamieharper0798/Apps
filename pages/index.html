<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JH Apps</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        background: #0b0a0f;
        color: #f5f2ea;
        padding: 2rem;
      }
      main {
        width: 100%;
        max-width: 640px;
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 1.5rem;
        text-align: center;
      }
      .apps {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      a.card {
        display: block;
        padding: 1.25rem;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      a.card:hover {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
      }
      .emoji {
        font-size: 1.75rem;
      }
      .name {
        display: block;
        margin-top: 0.5rem;
        font-weight: 600;
      }
      .desc {
        display: block;
        margin-top: 0.25rem;
        font-size: 0.85rem;
        color: rgba(245, 242, 234, 0.6);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>JH Apps</h1>
      <div class="apps">
        <a class="card" href="./dopamine-todo/">
          <span class="emoji">✅</span>
          <span class="name">Dopamine To-Do</span>
          <span class="desc">A to-do list with XP, streaks, and confetti.</span>
        </a>
        <a class="card" href="./beer-tracker/">
          <span class="emoji">🍺</span>
          <span class="name">Beer Tracker</span>
          <span class="desc">Group beer counter with photos, video milestones, and a leaderboard.</span>
        </a>
      </div>
    </main>
  </body>
</html>
